# Lokal: leitet Server-zu-Server-Aufrufe des Backends an das Moodle-Docker weiter.
# Moodle akzeptiert nur den Host "localhost:8000", daher wird der Host-Header gesetzt.
server {
    listen 80;
    location / {
        proxy_pass http://webserver;
        proxy_set_header Host localhost:8000;
    }
}
